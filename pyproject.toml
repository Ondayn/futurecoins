[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "futurecoins"
version = "0.1.0"
description = "Educational cryptocurrency simulation game"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
include = ["futurecoins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"